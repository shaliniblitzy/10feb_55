# =============================================================================
# pyproject.toml — GAE-GNP Facultativo Python/Flask Rewrite
# =============================================================================
# Central project manifest replacing all six Java build.gradle files from the
# original GAE-GNP Facultativo microservice platform. This single file defines
# project metadata, production and development dependencies, build system
# configuration, pytest settings, package discovery, and coverage thresholds.
#
# Original Java modules consolidated:
#   Module 1: administrador   (LoginService, RolService, UsuarioService)
#   Module 2: catalogos       (ReaseguradoraService)
#   Module 3: procesos        (OfertaService, PolizaService)
#   Module 4: reportes        (ArchivosUsuarioService)
#   Module 5: sincronizador-archivos (File Sync Services)
#   Module 6: tarifas         (Tariff Calculation)
# =============================================================================

# -----------------------------------------------------------------------------
# Build System Configuration
# -----------------------------------------------------------------------------
# Uses setuptools as the build backend, the standard Python packaging tool.
# Replaces the Gradle build tooling from the original Java project.
# -----------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

# -----------------------------------------------------------------------------
# Project Metadata
# -----------------------------------------------------------------------------
# Core project identity and Python version requirements.
# The project name matches the GAE-GNP Facultativo platform identifier.
# Requires Python 3.13+ for production stability (matching GCP App Engine runtime).
# -----------------------------------------------------------------------------
[project]
name = "gae-gnp-facultativo"
version = "1.0.0"
description = "GAE-GNP Facultativo — Python/Flask rewrite of Java-based microservice platform for GNP reinsurance operations"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "Proprietary"}

# -----------------------------------------------------------------------------
# Production Dependencies
# -----------------------------------------------------------------------------
# All 9 production packages with pinned versions for deterministic builds.
# Each dependency maps to a Java equivalent from the original platform:
#
#   Flask 3.1.2           → Spring Framework 6.2.7 + Embedded Tomcat 10.1.41
#   grpcio 1.78.0         → gRPC-Netty Shaded 1.70.0 + Direct Netty 4.1.121
#   grpcio-tools 1.78.0   → Gradle protobuf plugin
#   gunicorn 25.1.0       → Embedded Apache Tomcat 10.1.41
#   PyYAML 6.0.3          → Spring YAML configuration loader
#   python-dotenv 1.1.0   → Spring @Value / environment injection
#   bleach 6.2.0          → OWASP Java Encoder (Encode.forJava())
#   google-cloud-secret-manager 2.26.0 → GCP Secret Manager Java SDK
#   protobuf 6.33.5       → Java protobuf (transitive via gRPC)
#
# NOTE: google-cloud-secret-manager is pinned to 2.26.0 (not 2.23.0) because
# version 2.23.0 requires protobuf<6.0.0dev which conflicts with
# grpcio-tools 1.78.0 requiring protobuf>=6.31.1. Version 2.26.0 resolves
# this conflict with full backward-compatible API.
# -----------------------------------------------------------------------------
dependencies = [
    "Flask==3.1.2",
    "grpcio==1.78.0",
    "grpcio-tools==1.78.0",
    "gunicorn==25.1.0",
    "PyYAML==6.0.3",
    "python-dotenv==1.1.0",
    "bleach==6.2.0",
    "google-cloud-secret-manager==2.26.0",
    "protobuf==6.33.5",
]

# -----------------------------------------------------------------------------
# Optional Dependencies — Development and Testing
# -----------------------------------------------------------------------------
# Development dependencies separated as optional extras, installed via:
#   pip install -e ".[dev]"
#
# Replaces Java test dependencies:
#   pytest 8.4.0       → JUnit + AssertJ 3.27.3
#   pytest-cov 6.1.0   → Gradle JaCoCo plugin
#   pytest-flask 1.3.0 → Spring Test framework
# -----------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest==8.4.0",
    "pytest-cov==6.1.0",
    "pytest-flask==1.3.0",
]

# -----------------------------------------------------------------------------
# Pytest Configuration
# -----------------------------------------------------------------------------
# Replaces the Gradle test runner configuration (./gradlew test).
# Tests are discovered in the tests/ directory following standard naming:
#   - Files matching test_*.py
#   - Classes matching Test*
#   - Functions matching test_*
# Default options: verbose output (-v) with short tracebacks (--tb=short).
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# -----------------------------------------------------------------------------
# Package Discovery Configuration
# -----------------------------------------------------------------------------
# Setuptools package discovery settings:
#   - Include: app package (Flask application) and protos package (gRPC stubs)
#   - Exclude: tests package (not distributed with the application)
# This ensures only application code and proto definitions are packaged.
# -----------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["app*", "protos*"]
exclude = ["tests*"]

# -----------------------------------------------------------------------------
# Coverage Configuration
# -----------------------------------------------------------------------------
# Test coverage settings for pytest-cov, replacing the Gradle JaCoCo plugin.
#   - Source: only measure coverage for the app package
#   - Omit: exclude test files and auto-generated protobuf stubs (*_pb2*.py)
#   - Minimum threshold: 70% coverage required for builds to pass
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "protos/*_pb2*.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
